[package]
name = "uia-openai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uia-core = { path = "../uia-core" }
uia-mcp = { path = "../uia-mcp" }
# `default-features = false` drops the `cpal-io` feature: this crate imports
# only `uia_audio::codec::OpusCodec` and never opens a device, so the cpal
# device stack has no business in its dependency graph.
uia-audio = { path = "../uia-audio", default-features = false }
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# `webrtc` 0.20 is the sans-IO rewrite; `rtc` is REQUIRED alongside it because the
# codec parameter types a local media track needs are not re-exported by the facade.
# Version-locked together. Both are forbidden in uia-core (check-core-deps.sh).
webrtc = "=0.20.2"
rtc = "=0.20.2"
rand = "0.10"
# `Sample.data` is `bytes::Bytes`; this is the same version `rtc` already pulls.
bytes = "1"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["full", "test-util"] }
# The live audio test synthesises real speech to send, because OpenAI's server
# VAD will not treat a synthetic tone as speech. Integration tests do not
# inherit the crate's own dependencies, so these are repeated here.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart"] }
serde_json = "1"
uia-engine-contract = { path = "../uia-engine-contract" }
