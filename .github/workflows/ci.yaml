name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest #mycorx-ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: ./scripts/check-core-deps.sh
      - run: ./scripts/check-webrtc-lockfile-pins.sh
      - run: ./scripts/check-ipc-event-names.sh
      - run: ./scripts/check-copyright-headers.sh
      - run: ./scripts/check-os-aec-defaults.sh
      - run: ./scripts/tests/release-version/run-release-version-tests.sh
      - run: ./scripts/tests/gen-notice/run-gen-notice-tests.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
  # NOTICE.txt attributes every third-party dependency, so it has to be checked
  # against the real graph rather than trusted to whoever changed a manifest.
  # Its own job because it needs pnpm and Node, which the `test` job does not
  # otherwise carry — and `pnpm licenses list` reads the installed store, so
  # node_modules must exist for the npm half to mean anything.
  notice:
    runs-on: ubuntu-latest #mycorx-ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `cargo metadata` resolves the dependency graph without compiling, so
      # this job needs no system libraries and stays off the critical path.
      - run: ./scripts/gen-notice.sh --check

  # `desktop` is off by default (see uia-app/Cargo.toml) because tauri needs
  # GTK3 + WebKit2GTK-4.1 dev headers. The consequence was that `[[bin]] uia`
  # -- 1600 lines of main.rs, every #[tauri::command], the invoke_handler
  # registration and the managed state -- was never COMPILED by CI at all, so
  # `cargo test --workspace` went green on a binary that need not even build.
  # A command deleted from the handler list, or a state type never `.manage()`d,
  # shipped as a runtime "command not found".
  #
  # This is a compile check, not a test run: main.rs holds no tests, and the
  # logic worth testing belongs in the lib, where the `test` job already runs
  # it without a GUI toolchain. `--all-targets` so the bin, its tests and its
  # benches all typecheck.
  #
  # Its own job for the same reason `aec-feature` is: the apt closure for
  # libwebkit2gtk-4.1-dev alone is ~190 packages, which has no business on the
  # critical path.
  desktop-build:
    runs-on: ubuntu-latest #mycorx-ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev pkg-config
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-build
      - run: pnpm install --frozen-lockfile
      # `tauri::generate_context!()` embeds the frontend at COMPILE time from
      # `frontendDist` (../../dist), and dist/ is gitignored -- so without this
      # the cargo step below fails on a missing directory rather than on
      # anything about the Rust.
      - run: pnpm build
      - run: cargo check -p uia-app --features desktop --all-targets
      - run: cargo clippy -p uia-app --features desktop --all-targets -- -D warnings

  # `aec` is off by default because webrtc-audio-processing links a bundled
  # C++ library needing meson + ninja + libclang, which the main `test` job's
  # runner does not carry. Building it nowhere meant the whole path was
  # untested in CI. Its own job keeps that toolchain off the critical path.
  aec-feature:
    runs-on: ubuntu-latest #mycorx-ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config meson ninja-build clang libclang-dev
      # Caches ~/.cargo and target/ keyed on Cargo.lock, which is what actually
      # saves time here — the apt packages install fast and are not worth their
      # own cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aec-feature
      - run: cargo build -p uia-audio --features aec
      - run: cargo test -p uia-audio --features aec
