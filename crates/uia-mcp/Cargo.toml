[package]
name = "uia-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uia-core = { path = "../uia-core" }
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process"] }
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.5.1", features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
http = "1.5.0"
futures = "0.3.34"
# Must be the version `rmcp` itself uses: its streamable-HTTP client trait
# names `sse_stream::Sse` and `sse_stream::Error` in its signatures, so a newer
# `sse-stream` here is a different, incompatible type. Move it with `rmcp`.
sse-stream = "0.2.6"
# `rustls` here is also the SOLE source of reqwest 0.13's TLS backend: rmcp's
# `transport-streamable-http-client-reqwest` feature enables only reqwest's
# internal `__reqwest` marker, not a TLS backend
# (`cargo tree -p uia-mcp -e features -i reqwest@0.13.4` confirms the `rustls`
# feature edge traces to this line and nowhere else). Do not drop this
# dependency on the theory that "we don't call reqwest directly any more" —
# doing so would silently break every `https://` MCP server.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
# For the breadcrumb `oauth.rs` logs when it swallows a token-provider error
# into `None` - deliberately a bare static message, never the error's own
# body, so this dependency exists to log *that* a token was unavailable, not
# to log anything that could carry one.
tracing = "0.1.44"
# Re-exported from `auth::RefreshToken` so `uia-app`'s `KeyringCredentialStore`
# can construct one when splicing a separately-stored refresh token back onto
# a loaded `OAuthTokenResponse` — already pinned to this exact version
# transitively via rmcp's own dependency on it.
oauth2 = "5.0.0"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["full", "test-util"] }
