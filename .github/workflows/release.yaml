name: release

# Promotes the newest unreleased tag to a published GitHub Release.
#
# Run it by hand (Actions -> release -> Run workflow). It takes no version:
# the `tag` workflow already tagged every merge that bumped the version, and
# this finds the latest PUBLISHED release, takes the newest tag after it, and
# ships that. The tags in between are skipped; their PRs still appear in the
# release notes.
#
# Order: plan -> build + test + smoke -> publish. The release stays a draft
# until the full test suite and both installer smoke tests pass.
#
# `dry_run` builds and tests but creates no release; the installers land as
# Actions artifacts, which is how a tester gets a build. A dry run may start
# from ANY branch and then builds that branch's own commit (not main's newest
# tag), so a change to the build can be proven before it merges. It signs with
# a throwaway key and never touches the real one.
#
# A real release must start from main. Its two gates are GitHub Environments:
#   draft-release   holds the updater signing key; deployable from main only.
#                   Used by the build jobs, so the key is unreachable from a
#                   branch.
#   public-release  gates `publish`, the only job that makes anything public.
on:
  workflow_dispatch:
    inputs:
      component:
        description: Which component to release
        type: choice
        options: [uai-app]
        default: uai-app
      dry_run:
        description: Build and test only; create no release
        type: boolean
        default: false

# Read-only by default; only the jobs that touch the release widen it.
permissions:
  contents: read

# Queued, never cancelled: cancelling a run between "draft created" and
# "published" would strand a draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides what ships. Fails here, in seconds, when there is nothing newer
  # than the last published release, before any runner builds anything.
  plan:
    runs-on: ubuntu-latest
    outputs:
      target_tag: ${{ steps.plan.outputs.target_tag }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
      target_version: ${{ steps.plan.outputs.target_version }}
      baseline_tag: ${{ steps.plan.outputs.baseline_tag }}
    steps:
      # Only a dry run may start from a branch. A real release builds and
      # publishes with this branch's workflow and tooling, so it must be main's.
      - name: Real releases run from main
        if: ${{ github.ref != 'refs/heads/main' && !inputs.dry_run }}
        run: |
          echo "::error::A real release must run from main, not ${GITHUB_REF_NAME}. Tick dry_run to test a branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # A branch dry run builds the branch itself, at its own version.
            python3 scripts/release plan --component "$COMPONENT" --head-sha "$GITHUB_SHA"
          else
            python3 scripts/release plan --component "$COMPONENT"
          fi

  # The tag must say what the manifests say. Replaces the old tag-vs-manifest
  # gate: the tag is derived from version.json, so this catches only a tag that
  # was created by hand on a commit whose manifests disagree.
  verify-target:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ needs.plan.outputs.target_version }}
        run: python3 scripts/release sync --check --component "$COMPONENT" --expect-version "$VERSION"

  # The full CI suite, at the commit being shipped rather than at main's head.
  tests:
    needs: [plan, verify-target]
    # The test suite must not inherit a write token.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml
    with:
      ref: ${{ needs.plan.outputs.target_sha }}

  # The draft is created exactly once, here, so that `linux` and `windows` can
  # run in PARALLEL and only upload into it. They cannot safely create it
  # themselves: tauri-action's getOrCreateRelease is a read-then-create with no
  # locking, and two parallel jobs would each create one, leaving two drafts for
  # one version.
  #
  # It waits for `tests`, and the builds wait for it, so a red test run costs no
  # build minutes and leaves no draft release behind.
  create-release:
    needs: [plan, verify-target, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `scripts/release notes` reads the PRs behind each commit.
      pull-requests: read
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      # Steps are conditional rather than the job: a skipped job counts as
      # unsuccessful to `needs`, which would strand every build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.dry_run }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build the release notes
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          BASELINE: ${{ needs.plan.outputs.baseline_tag }}
          TARGET: ${{ needs.plan.outputs.target_tag }}
        run: >
          python3 scripts/release notes
          --component "$COMPONENT" --baseline "$BASELINE" --target "$TARGET"
          > "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        id: draft
        if: ${{ !inputs.dry_run }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Passed as environment variables rather than interpolated into the
          # script body, which would be a code injection point.
          TAG: ${{ needs.plan.outputs.target_tag }}
          VERSION: ${{ needs.plan.outputs.target_version }}
          COMPONENT: ${{ inputs.component }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        with:
          result-encoding: string
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const body = fs.readFileSync(process.env.NOTES_FILE, 'utf8')
            const tag = process.env.TAG

            // Idempotent, so re-running a failed release reuses its draft.
            // There is no getReleaseByTag for drafts, so this pages the list.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            })
            const existing = releases.find((r) => r.tag_name === tag && r.draft)
            if (existing) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: existing.id, body })
              core.info(`Reusing draft release ${existing.id} for ${tag}`)
              return String(existing.id)
            }

            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `${process.env.COMPONENT} ${process.env.VERSION}`,
              draft: true,
              prerelease: false,
              body,
            })
            core.info(`Created draft release ${data.id} for ${tag}`)
            return String(data.id)

  linux:
    needs: [plan, verify-target, create-release]
    runs-on: ubuntu-latest
    # Real runs use the `draft-release` environment (main only), which holds the
    # updater key. A dry run uses no environment, so it can start from a branch.
    environment: ${{ !inputs.dry_run && 'draft-release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.target_sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # The same closure `desktop-build` installs in ci.yaml -- tauri needs
      # GTK3 + WebKit2GTK-4.1 dev headers, and uia-audio needs ALSA.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev pkg-config
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux
      - run: pnpm install --frozen-lockfile

      - name: Build and attach to the draft release
        if: ${{ !inputs.dry_run }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        # The updater key (docs/RELEASE.md), from the `draft-release`
        # environment, on this step only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Not the repository root: tauri.conf.json lives beside the crate,
          # and its `frontendDist` is resolved relative to itself.
          projectPath: crates/uia-app
          tauriScript: pnpm exec tauri
          # Linux ships as a .deb only. AppImage was dropped deliberately: its
          # bundler downloads and executes *unpinned* content at build time,
          # inside the job that produces the binaries we ship (docs/RELEASE.md).
          args: --bundles deb
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # The feed is assembled once, by `updater-manifest`, after both
          # builds: tauri-action's own latest.json is read-modify-write on the
          # release, and two parallel jobs would drop each other's platform.
          includeUpdaterJson: false

      # A dry run never sees the real updater key: it lives in the
      # `draft-release` environment, which only main can use. Signing with a
      # throwaway key still proves the bundler signs and writes the .sig.
      - name: Throwaway signing key (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: crates/uia-app
        run: |
          pnpm exec tauri signer generate --ci --password dry-run --write-keys "$RUNNER_TEMP/dry-run.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/dry-run.key")" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=dry-run" >> "$GITHUB_ENV"

      - name: Build without releasing
        if: ${{ inputs.dry_run }}
        working-directory: crates/uia-app
        run: pnpm exec tauri build --bundles deb

      # A missing key or a build without updater artifacts produces no .sig;
      # fail here, on a dry run too, not later in `updater-manifest`.
      - name: Check the updater signature was produced
        run: ls target/release/bundle/deb/*.deb.sig

      - name: Record shipped binary size
        run: |
          size=$(stat -c%s target/release/uia)
          echo "### Shipped binary size" >> "$GITHUB_STEP_SUMMARY"
          echo "\`target/release/uia\`: ${size} bytes" >> "$GITHUB_STEP_SUMMARY"

      # Uploaded on every run, not just dry runs: the smoke job installs this
      # exact file rather than downloading it back from the draft.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uia-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
          if-no-files-found: error

  windows:
    needs: [plan, verify-target, create-release]
    # An MSI cannot be produced on a Linux runner: WiX only runs on Windows.
    runs-on: windows-latest
    # Real runs use the `draft-release` environment (main only), which holds the
    # updater key. A dry run uses no environment, so it can start from a branch.
    environment: ${{ !inputs.dry_run && 'draft-release' || '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.target_sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows
      - run: pnpm install --frozen-lockfile

      - name: Build and attach to the draft release
        if: ${{ !inputs.dry_run }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        # The updater key (docs/RELEASE.md), from the `draft-release`
        # environment, on this step only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/uia-app
          tauriScript: pnpm exec tauri
          args: --bundles msi
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # The feed is assembled once, by `updater-manifest`, after both
          # builds: tauri-action's own latest.json is read-modify-write on the
          # release, and two parallel jobs would drop each other's platform.
          includeUpdaterJson: false

      # See the Linux job: a dry run signs with a throwaway key.
      - name: Throwaway signing key (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: crates/uia-app
        shell: pwsh
        run: |
          pnpm exec tauri signer generate --ci --password dry-run --write-keys "$env:RUNNER_TEMP/dry-run.key"
          "TAURI_SIGNING_PRIVATE_KEY=$(Get-Content -Raw "$env:RUNNER_TEMP/dry-run.key")" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=dry-run" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build without releasing
        if: ${{ inputs.dry_run }}
        working-directory: crates/uia-app
        run: pnpm exec tauri build --bundles msi

      # A missing key or a build without updater artifacts produces no .sig;
      # fail here, on a dry run too, not later in `updater-manifest`.
      - name: Check the updater signature was produced
        shell: pwsh
        run: |
          if (-not (Get-ChildItem target/release/bundle/msi/*.msi.sig -ErrorAction SilentlyContinue)) {
            Write-Error "no target/release/bundle/msi/*.msi.sig was produced"
            exit 1
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uia-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
          if-no-files-found: error

  # A clean-machine check of the installer that was just built: install it,
  # confirm the version, start the binary, uninstall. See scripts/smoke/.
  smoke-linux:
    needs: [plan, linux]
    runs-on: ubuntu-26.04
    # A bare image, not the runner: the runner has far more installed than a
    # user's machine, which would hide a missing dependency.
    container:
      image: ubuntu:26.04
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uia-linux
          path: installer
      - env:
          VERSION: ${{ needs.plan.outputs.target_version }}
        run: bash scripts/smoke/linux.sh installer/*.deb "$VERSION"

  smoke-windows:
    needs: [plan, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uia-windows
          path: installer
      - env:
          VERSION: ${{ needs.plan.outputs.target_version }}
        shell: pwsh
        run: |
          $msi = (Get-ChildItem installer/*.msi | Select-Object -First 1).FullName
          ./scripts/smoke/windows.ps1 -Msi $msi -Version $env:VERSION

  # Builds latest.json -- the feed every installed app checks -- from the
  # draft's installers and their .sig files, in one write, and attaches it.
  # `publish` waits for it, so a release never goes live without a valid feed.
  updater-manifest:
    if: ${{ !inputs.dry_run }}
    needs: [plan, create-release, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ needs.plan.outputs.target_tag }}
          VERSION: ${{ needs.plan.outputs.target_version }}
        run: >
          python3 scripts/release updater-manifest
          --release-id "$RELEASE_ID" --tag "$TAG" --version "$VERSION"
          --require windows --require linux
          --out "$RUNNER_TEMP/latest.json"
      - name: Attach latest.json to the draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          MANIFEST: ${{ runner.temp }}/latest.json
        with:
          script: |
            const fs = require('fs')
            const { owner, repo } = context.repo
            const release_id = Number(process.env.RELEASE_ID)
            // Idempotent: a re-run replaces the feed instead of failing on
            // the name already being taken.
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            })
            for (const asset of assets.filter((a) => a.name === 'latest.json')) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id })
            }
            const data = fs.readFileSync(process.env.MANIFEST)
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: 'latest.json', data,
              headers: { 'content-type': 'application/json', 'content-length': data.length },
            })
            core.info('Attached latest.json')

  # The only job that makes anything public, and only when every gate passed.
  publish:
    if: ${{ !inputs.dry_run }}
    needs: [plan, create-release, tests, smoke-linux, smoke-windows, updater-manifest]
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo
            await github.rest.repos.updateRelease({
              owner, repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            })
            core.info(`Published release ${process.env.RELEASE_ID}`)

  # TEMPORARY -- delete this job when the `macos` job below is uncommented.
  #
  # There is no Apple Developer ID certificate yet, and an unsigned .app
  # downloaded from a release is quarantined by Gatekeeper and will not open by
  # double-clicking (docs/RELEASE.md). So nothing is built or attached here; the
  # job only leaves a visible note on the run that macOS users build locally.
  macos-local-build-note:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Point macOS users at the local build
        env:
          TAG: ${{ needs.plan.outputs.target_tag }}
        run: |
          echo "::notice title=No macOS artifact::macOS is not built by this workflow until a Developer ID certificate exists. Build locally with ./scripts/build-macos-package.sh (see docs/RELEASE.md)."
          {
            echo "### macOS: build locally"
            echo
            echo "This release has no macOS artifact: an unsigned \`.app\` downloaded"
            echo "from GitHub is blocked by Gatekeeper. On a Mac, from a checkout of"
            echo "\`${TAG}\`:"
            echo
            echo '```bash'
            echo "./scripts/build-macos-package.sh            # tests, then .app + .dmg (native arch)"
            echo "./scripts/build-macos-package.sh --target universal-apple-darwin"
            echo '```'
            echo
            echo "Output: \`target/[<triple>/]release/bundle/{macos/*.app,dmg/*.dmg}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Signed + notarized macOS build. Commented out until the Apple Developer ID
  # certificate exists; when uncommenting it, delete `macos-local-build-note`.
  #
  # Before enabling:
  #   1. Add crates/uia-app/Entitlements.plist with
  #      `com.apple.security.device.audio-input` = true, and point
  #      `bundle.macOS.entitlements` in tauri.conf.json at it. A Developer ID
  #      build runs under the hardened runtime, which blocks the microphone
  #      without that entitlement: no prompt, just silence (docs/RELEASE.md).
  #   2. Add the repository secrets read below. APPLE_CERTIFICATE is the
  #      "Developer ID Application" certificate exported as .p12, then
  #      base64-encoded (`base64 -i cert.p12 | pbcopy`); the Tauri bundler
  #      imports it into a temporary keychain itself. APPLE_PASSWORD is an
  #      app-specific password for APPLE_ID, not the account password.
  #   3. Uncomment `smoke-macos` below as well, and add both `macos` and
  #      `smoke-macos` to `publish.needs`, so a failed macOS build or smoke test
  #      keeps the release a draft like the other platforms, and add `macos` to
  #      `updater-manifest.needs` and `--require macos` to its command.
  #   4. Put the APPLE_* secrets in the `draft-release` environment, not the
  #      repository, and give this job the same `environment:` line as `linux`
  #      and `windows`; for a dry run it also needs a throwaway signing key
  #      step like theirs.
  #   5. Do a dry run (workflow_dispatch) and check the `uia-macos` artifact
  #      on a second Mac before tagging.
  #
  # macos:
  #   needs: [plan, verify-target, create-release]
  #   # GitHub-hosted, Apple silicon. One universal binary covers both Intel
  #   # and Apple silicon Macs, so one job is enough.
  #   runs-on: macos-latest
  #   permissions:
  #     contents: write
  #   env:
  #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
  #     # Notarization. The App Store Connect API key trio (APPLE_API_KEY,
  #     # APPLE_API_ISSUER, APPLE_API_KEY_PATH) works instead of these three.
  #     APPLE_ID: ${{ secrets.APPLE_ID }}
  #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         ref: ${{ needs.plan.outputs.target_sha }}
  #     - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
  #       with:
  #         targets: aarch64-apple-darwin,x86_64-apple-darwin
  #     - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
  #     - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
  #       with:
