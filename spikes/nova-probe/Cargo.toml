[package]
name = "nova-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# Excluded from the root workspace (throwaway spike); its own workspace root.
[workspace]

[dependencies]
aws-config = "1.10.1"
# Defaults minus the legacy `rustls` feature (hyper 0.14 / rustls 0.21).
aws-sdk-bedrockruntime = { version = "1.139.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1"
