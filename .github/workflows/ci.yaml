name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # Called by release.yaml to run the whole suite at the commit being shipped.
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty means the triggering ref
        type: string
        default: ""
jobs:
  # A PR that touches only docs, markdown or other non-code files has nothing for
  # these jobs to check, so they are skipped. The skip is per JOB, not a `paths:`
  # filter on the workflow: a workflow that never starts leaves its required
  # checks "Expected" forever and the PR cannot merge, whereas a job skipped by
  # `if:` counts as passing. `ci-ok` at the bottom is the one required check.
  #
  # "Code" is every `code_paths` entry in .github/release-components.json (the
  # same definition the release labels use) plus what CI itself runs or checks.
  # Editing the registry is itself a trigger, so a PR cannot narrow the filter
  # and skip the jobs in the same change.
  #
  # workflow_dispatch and workflow_call (release.yaml, at the commit being
  # shipped) always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The PR merge commit and its first parent, the base branch tip.
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, "scripts/release")
          from paths import matches

          # What CI runs or checks beyond the app's own code_paths.
          EXTRA = [
              ".github/workflows/**",
              ".github/release-components.json",
              "scripts/**",
              "NOTICE.txt",
              "LICENSES/**",
              "uia.example.toml",
          ]

          def emit(code, why):
              print(f"code={code}: {why}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"code={code}\n")

          if os.environ["EVENT"] != "pull_request":
              emit("true", f"{os.environ['EVENT']} always runs the full suite")
              sys.exit(0)

          with open(".github/release-components.json") as f:
              registry = json.load(f)
          patterns = EXTRA + [p for c in registry.values() for p in c["code_paths"]]
          files = subprocess.run(
              ["git", "diff", "--name-only", "HEAD^1", "HEAD"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          print("changed files:", *files, sep="\n  ")
          hit = [f for f in files if any(matches(p, f) for p in patterns)]
          if hit:
              emit("true", f"{hit[0]} is a code path")
          else:
              emit("false", "no code, script or workflow changes")
          PY
  test-ubuntu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: ./scripts/check-core-deps.sh
      - run: ./scripts/check-webrtc-lockfile-pins.sh
      - run: ./scripts/check-ipc-event-names.sh
      - run: ./scripts/check-copyright-headers.sh
      - run: ./scripts/check-os-aec-defaults.sh
      - run: ./scripts/tests/release/run-release-tests.sh
      - run: python3 scripts/release sync --check
      - run: ./scripts/tests/gen-notice/run-gen-notice-tests.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
  # NOTICE.txt attributes every third-party dependency, so it has to be checked
  # against the real graph rather than trusted to whoever changed a manifest.
  # Its own job because it needs pnpm and Node, which the `test-ubuntu` job does not
  # otherwise carry — and `pnpm licenses list` reads the installed store, so
  # node_modules must exist for the npm half to mean anything.
  notice:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `cargo metadata` resolves the dependency graph without compiling, so
      # this job needs no system libraries and stays off the critical path.
      - run: ./scripts/gen-notice.sh --check

  # `desktop` is off by default (see uia-app/Cargo.toml) because tauri needs
  # GTK3 + WebKit2GTK-4.1 dev headers. The consequence was that `[[bin]] uia`
  # -- 1600 lines of main.rs, every #[tauri::command], the invoke_handler
  # registration and the managed state -- was never COMPILED by CI at all, so
  # `cargo test --workspace` went green on a binary that need not even build.
  # A command deleted from the handler list, or a state type never `.manage()`d,
  # shipped as a runtime "command not found".
  #
  # This is a compile check, not a test run: main.rs holds no tests, and the
  # logic worth testing belongs in the lib, where the `test-ubuntu` job already runs
  # it without a GUI toolchain. `--all-targets` so the bin, its tests and its
  # benches all typecheck.
  #
  # Its own job for the same reason `aec-feature` is: the apt closure for
  # libwebkit2gtk-4.1-dev alone is ~190 packages, which has no business on the
  # critical path.
  desktop-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev pkg-config
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-build
      - run: pnpm install --frozen-lockfile
      # `tauri::generate_context!()` embeds the frontend at COMPILE time from
      # `frontendDist` (../../dist), and dist/ is gitignored -- so without this
      # the cargo step below fails on a missing directory rather than on
      # anything about the Rust.
      - run: pnpm build
      - run: cargo check -p uia-app --features desktop --all-targets
      - run: cargo clippy -p uia-app --features desktop --all-targets -- -D warnings

  # `aec` is off by default because webrtc-audio-processing links a bundled
  # C++ library needing meson + ninja + libclang, which the main `test-ubuntu` job's
  # runner does not carry. Building it nowhere meant the whole path was
  # untested in CI. Its own job keeps that toolchain off the critical path.
  aec-feature:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config meson ninja-build clang libclang-dev
      # Caches ~/.cargo and target/ keyed on Cargo.lock, which is what actually
      # saves time here — the apt packages install fast and are not worth their
      # own cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aec-feature
      - run: cargo build -p uia-audio --features aec
      - run: cargo test -p uia-audio --features aec

  # Every job above runs on Linux, so code that only exists on another OS never
  # compiled in CI: the `cfg(not(unix))` Windows branches, the Credential
  # Manager and Keychain keyring backends, the per-OS echo cancellation
  # (Voice Processing IO on macOS), and paths with backslashes. These two jobs
  # run the same compile and test checks natively on each OS, so a change that
  # only breaks one of them is caught on the PR instead of on a user's machine.
  #
  # Two jobs rather than a matrix so a failure names its OS in the checks list
  # and each OS keeps its own cache key. The repository scripts (copyright
  # headers, IPC event names, NOTICE, ...) stay in the Linux jobs above: they
  # are platform-independent and need bash 4 / Python 3.11, which macOS does
  # not ship.
  #
  # No apt-style system packages: GTK and WebKit are Linux-only, and tauri
  # uses the OS's own webview on both of these. Standard GitHub-hosted runners
  # are free for a public repository, so both run on every pull request.
  test-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-windows
      - run: pnpm install --frozen-lockfile
      # `tauri::generate_context!()` embeds the frontend at compile time from
      # the gitignored dist/ -- see `desktop-build` above.
      - run: pnpm build
      - run: cargo test --workspace
      - run: cargo clippy --all-targets -- -D warnings
      # Compiles main.rs and every #[tauri::command] against the Windows
      # WebView2 bindings -- the code a user actually runs.
      - run: cargo check -p uia-app --features desktop --all-targets
      - run: cargo clippy -p uia-app --features desktop --all-targets -- -D warnings

  # `macos-latest` is an Apple silicon runner. The release workflow's
  # commented-out `macos` job builds the universal (Intel + Apple silicon)
  # binary separately; this job only checks that the code builds and passes.
  test-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-macos
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --workspace
      - run: cargo clippy --all-targets -- -D warnings
      # Compiles main.rs and every #[tauri::command] against WKWebView.
      - run: cargo check -p uia-app --features desktop --all-targets
      - run: cargo clippy -p uia-app --features desktop --all-targets -- -D warnings

  # The single required check. A job skipped by `changes` passes; one that failed
  # or was cancelled fails this, so branch protection only needs to name `ci-ok`.
  ci-ok:
    needs: [changes, test-ubuntu, notice, desktop-build, aec-feature, test-windows, test-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = false
